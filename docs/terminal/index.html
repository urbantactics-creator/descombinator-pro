Why do developers love terminal aesthetics? Let's explore.

## The Appeal

1. **Constraint breeds creativity** — Limited palette, monospace grid
2. **Nostalgia** — Reminds us of early computing
3. **Focus** — No distractions, pure content
4. **Hacker cred** — Looks impressive to non-devs

Classic terminal palettes:

| Name | Background | Foreground | Accent |
|------|------------|------------|--------|
| Green Phosphor | #0a0a0a | #00ff41 | #00ff88 |
| Amber | #1a1000 | #ffb000 | #ffcc44 |

A practical approach to dotfile management.

## The Problem

Config files scattered across \`$HOME\`:
\`\`\`
~/.bashrc
~/.vimrc
~/.gitconfig
~/.config/nvim/init.lua
~/.config/alacritty/alacritty.yml
\`\`\`

## The Solution: GNU Stow

\`\`\`bash
# Install
sudo apt install stow  # Debian/Ubuntu
brew install stow      # macOS

# Structure
dotfiles/
├── bash/
│   └── .bashrc
├── git/
│   └── .gitconfig
├── nvim/
│   └── .config/nvim/
│       └── init.lua
└── alacritty/
    └── .config/alacritty/
        └── alacritty.yml
\`\`\`

## Usage

\`\`\`bash
cd ~/dotfiles
stow bash git nvim alacritty
\`\`\`

Stow creates symlinks from \`$HOME\` to your dotfiles directory.

## Advanced: Per-Machine Configs

\`\`\`bash
dotfiles/
├── bash/
│   ├── .bashrc
│   └── .bashrc.work    # Work-specific
├── git/
│   ├── .gitconfig
│   └── .gitconfig.personal
\`\`\`

Use a bootstrap script to select the right variant.

## Git Integration

\`\`\`bash
# In dotfiles repo
git add .
git commit -m "Update nvim config"
git push
\`\`\`

On new machine:
\`\`\`bash
git clone https://github.com/you/dotfiles.git
cd dotfiles
./bootstrap.sh
\`\`\`

## Tips

- Keep secrets out (use \`pass\` or \`1password\` CLI)
- Document your bootstrap process
- Test on clean VM regularly
- Use \`stow -n\` for dry-run

Stow makes dotfiles portable, version-controlled, and symlink-managed.`

      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.15);

      gain.gain.setValueAtTime(0.03, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.18);
    }

    function playErrorSound() {
      if (!state.soundEnabled || !state.audioContext) return;

      const ctx = state.audioContext;
      if (ctx.state === 'suspended') ctx.resume();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, ctx.currentTime);

      gain.gain.setValueAtTime(0.04, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.3);
    }

    // ============================================
    // OUTPUT HELPERS
    // ============================================
    function appendOutput(html, className = 'command-output') {
      const line = document.createElement('div');
      line.className = `output-line ${className}`;
      line.innerHTML = html;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    function appendError(msg) {
      appendOutput(`<span class="error">Error: ${escapeHtml(msg)}</span>`, 'error');
    }

    function appendWarning(msg) {
      appendOutput(`<span class="warning">${escapeHtml(msg)}</span>`, 'warning');
    }

    function appendMuted(msg) {
      appendOutput(`<span class="muted">${escapeHtml(msg)}</span>`, 'muted');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function clearOutput() {
      output.innerHTML = '';
    }

    function updatePrompt() {
      prompt.textContent = '$';
      cwdDisplay.textContent = state.cwd;
      filterStatus.textContent = state.currentFilter ? ` [filter: ${state.currentFilter}]` : '';
    }

    function updateTime() {
      const now = new Date();
      timeDisplay.textContent = now.toLocaleTimeString('en-US', { hour12: false });
    }

    // ============================================
    // COMMAND SYSTEM
    // ============================================
    const commands = {
      ls: {
        args: '[path]',
        description: 'List posts and projects',
        execute: (args) => {
          const filter = state.currentFilter;
          let posts = POSTS;
          let projects = PROJECTS;

          if (filter) {
            posts = posts.filter(p => p.tags.includes(filter));
            projects = projects.filter(p => p.tags.includes(filter));
          }

          if (posts.length === 0 && projects.length === 0) {
            appendMuted(`No entries found${filter ? ` for tag "${filter}"` : ''}`);
            return;
          }

          if (posts.length > 0) {
            appendOutput('<span class="accent">POSTS</span>');
            posts.forEach(p => {
              const tags = p.tags.map(t => `<span class="tag-filter">${t}</span>`).join('');
              appendOutput(`  <span class="file-entry"><span class="name">${p.slug}.md</span><span class="meta">${p.date} ${tags}</span></span>`);
            });
          }

          if (projects.length > 0) {
            appendOutput('<span class="accent">PROJECTS</span>');
            projects.forEach(p => {
              const tags = p.tags.map(t => `<span class="tag-filter">${t}</span>`).join('');
              appendOutput(`  <span class="file-entry"><span class="name dir">${p.name}/</span><span class="meta">${p.language} ⭐${p.stars} ${tags}</span></span>`);
            });
          }

          appendMuted(`Total: ${posts.length} post(s), ${projects.length} project(s)`);
        }
      },
      cat: {
        args: '<post-slug>',
        description: 'Read a post (markdown rendered)',
        execute: (args) => {
          if (!args[0]) {
            appendError('Usage: cat <post-slug>');
            return;
          }

          const slug = args[0].replace('.md', '');
          const post = POSTS.find(p => p.slug === slug);

          if (!post) {
            appendError(`Post not found: ${slug}`);
            appendMuted('Use "ls" to see available posts');
            return;
          }

          const html = marked.parse(post.content);
          appendOutput(`
            <div class="post-content">
              <div class="post-header">
                <div class="title">${escapeHtml(post.title)}</div>
                <div class="meta">${post.date} · ${post.tags.map(t => `<span class="tag-filter">${t}</span>`).join(' ')}</div>
              </div>
              ${html}
            </div>
          `);
        }
      },
      cd: {
        args: '<tag|..>',
        description: 'Filter by tag (use ".." to clear filter)',
        execute: (args) => {
          if (!args[0]) {
            appendError('Usage: cd <tag|..>');
            return;
          }

          if (args[0] === '..') {
            state.currentFilter = null;
            state.cwd = '~';
            appendMuted('Filter cleared');
          } else {
            const allTags = [...new Set([...POSTS.flatMap(p => p.tags), ...PROJECTS.flatMap(p => p.tags)])];
            if (!allTags.includes(args[0])) {
              appendError(`Unknown tag: ${args[0]}`);
              appendMuted(`Available tags: ${allTags.join(', ')}`);
              return;
            }
            state.currentFilter = args[0];
            state.cwd = `~/${args[0]}`;
            appendMuted(`Filtering by tag: ${args[0]}`);
          }
          updatePrompt();
        }
      },
      whoami: {
        args: '',
        description: 'Show about page',
        execute: () => {
          const links = ABOUT.links.map(l => `<a class="link" href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join(' · ');
          appendOutput(`
            <div class="about-content">
              <div class="section">
                <span class="label">Name:</span> <span class="value">${escapeHtml(ABOUT.name)}</span>
              </div>
              <div class="section">
                <span class="label">Handle:</span> <span class="value">${escapeHtml(ABOUT.handle)}</span>
              </div>
              <div class="section">
                <span class="label">Location:</span> <span class="value">${escapeHtml(ABOUT.location)}</span>
              </div>
              <div class="section">
                <span class="label">Bio:</span> <span class="value">${escapeHtml(ABOUT.bio)}</span>
              </div>
              <div class="section">
                <span class="label">Skills:</span> <span class="value">${ABOUT.skills.join(', ')}</span>
              </div>
              <div class="section">
                <span class="label">Links:</span> <span class="value">${links}</span>
              </div>
            </div>
          `);
        }
      },
      mail: {
        args: '[address]',
        description: 'Open contact composer',
        execute: (args) => {
          state.isComposingMail = true;
          state.mailData = { to: args[0] || '', subject: '', body: '' };
          state.mailField = 'to';
          renderMailComposer();
        }
      },
      help: {
        args: '',
        description: 'Show help (man-page style)',
        execute: () => {
          let html = '<div class="man-page">';
          html += '<div class="section"><div class="section-title">TERMINAL BLOG — COMMANDS</div>';

          Object.entries(commands).forEach(([name, cmd]) => {
            html += `
              <div class="command-desc">
                <span class="command-name">${name}</span>
                <span class="command-args">${cmd.args}</span>
                <span class="command-help">${cmd.description}</span>
              </div>
            `;
          });

          html += '</div>';
          html += '<div class="section"><div class="section-title">KEYBOARD SHORTCUTS</div>';
          html += `
            <div class="command-desc"><span class="command-name">Tab</span><span class="command-help">Auto-complete commands and arguments</span></div>
            <div class="command-desc"><span class="command-name">↑ / ↓</span><span class="command-help">Navigate command history</span></div>
            <div class="command-desc"><span class="command-name">Ctrl+L</span><span class="command-help">Clear screen</span></div>
            <div class="command-desc"><span class="command-name">Ctrl+C</span><span class="command-help">Cancel current input</span></div>
            <div class="command-desc"><span class="command-name">F11</span><span class="command-help">Toggle CRT scanlines</span></div>
            <div class="command-desc"><span class="command-name">F12</span><span class="command-help">Toggle keypress sound</span></div>
          `;
          html += '</div>';
          html += '<div class="section"><div class="section-title">NAVIGATION</div>';
          html += `
            <div class="command-desc"><span class="command-name">ls</span><span class="command-help">List all posts and projects</span></div>
            <div class="command-desc"><span class="command-name">cat <post></span><span class="command-help">Read a post (markdown rendered)</span></div>
            <div class="command-desc"><span class="command-name">cd <tag></span><span class="command-help">Filter by tag</span></div>
            <div class="command-desc"><span class="command-name">cd ..</span><span class="command-help">Clear tag filter</span></div>
          `;
          html += '</div>';
          html += '</div>';

          appendOutput(html);
        }
      },
      clear: {
        args: '',
        description: 'Clear the screen',
        execute: () => {
          clearOutput();
        }
      },
      pwd: {
        args: '',
        description: 'Print working directory',
        execute: () => {
          appendOutput(state.cwd);
        }
      },
      tags: {
        args: '',
        description: 'List all available tags',
        execute: () => {
          const allTags = [...new Set([...POSTS.flatMap(p => p.tags), ...PROJECTS.flatMap(p => p.tags)])].sort();
          appendOutput('<span class="accent">AVAILABLE TAGS</span>');
          allTags.forEach(tag => {
            const postCount = POSTS.filter(p => p.tags.includes(tag)).length;
            const projCount = PROJECTS.filter(p => p.tags.includes(tag)).length;
            appendOutput(`  <span class="tag-filter">${tag}</span> <span class="muted">(${postCount} posts, ${projCount} projects)</span>`);
          });
        }
      },
      date: {
        args: '',
        description: 'Show current date and time',
        execute: () => {
          const now = new Date();
          appendOutput(now.toString());
        }
      },
      echo: {
        args: '<text>',
        description: 'Echo text back',
        execute: (args) => {
          appendOutput(args.join(' '));
        }
      }
    };

    // ============================================
    // TAB COMPLETION
    // ============================================
    function getCompletions(input) {
      const parts = input.trim().split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const arg = parts[1] || '';

      // Command completion
      if (parts.length === 1 && !input.endsWith(' ')) {
        return Object.keys(commands).filter(c => c.startsWith(cmd));
      }

      // Argument completion for specific commands
      switch (cmd) {
        case 'cat':
          return POSTS.map(p => p.slug + '.md').filter(s => s.startsWith(arg));
        case 'cd':
          const allTags = [...new Set([...POSTS.flatMap(p => p.tags), ...PROJECTS.flatMap(p => p.tags)])];
          return ['..', ...allTags].filter(t => t.startsWith(arg));
        case 'mail':
          return []; // Email addresses - could add contacts
        default:
          return [];
      }
    }

    function updateGhostText() {
      const input = commandInput.value;
      const completions = getCompletions(input);

      if (completions.length === 1) {
        const completion = completions[0];
        const parts = input.trim().split(/\s+/);
        const prefix = parts.slice(0, -1).join(' ') + (parts.length > 1 ? ' ' : '');
        state.ghostText = prefix + completion;
      } else {
        state.ghostText = '';
      }

      // Update ghost suggestion display
      const ghostEl = document.querySelector('.ghost-suggestion');
      if (ghostEl) ghostEl.remove();

      if (state.ghostText && input) {
        const ghost = document.createElement('span');
        ghost.className = 'ghost-suggestion';
        ghost.textContent = state.ghostText.slice(input.length);
        commandInput.parentNode.appendChild(ghost);
        commandInput.classList.add('ghost-mode');
      } else {
        commandInput.classList.remove('ghost-mode');
      }
    }

    function applyCompletion() {
      if (state.ghostText) {
        commandInput.value = state.ghostText;
        updateGhostText();
      }
    }

    // ============================================
    // MAIL COMPOSER
    // ============================================
    function renderMailComposer() {
      const { to, subject, body } = state.mailData;
      const fields = [
        { id: 'to', label: 'To:', value: to, type: 'email', placeholder: 'recipient@example.com' },
        { id: 'subject', label: 'Subject:', value: subject, type: 'text', placeholder: 'Hello' },
        { id: 'body', label: 'Body:', value: body, type: 'textarea', placeholder: 'Your message...' }
      ];

      let html = '<div class="mail-composer">';
      html += '<div class="section"><div class="section-title">MAIL COMPOSER</div>';
      html += '<div class="muted">Tab to navigate fields, Enter to send, Escape to cancel</div>';

      fields.forEach(f => {
        const isActive = f.id === state.mailField;
        html += `
          <div class="field">
            <span class="field-label">${f.label}</span>
            <input
              class="field-input ${isActive ? 'active' : ''}"
              type="${f.type === 'textarea' ? 'text' : f.type}"
              id="mail-${f.id}"
              value="${escapeHtml(f.value)}"
              placeholder="${f.placeholder}"
              ${f.type === 'textarea' ? '' : ''}
            >
          </div>
        `;
      });

      html += '<button class="send-btn" id="mailSend">SEND</button>';
      html += '</div>';

      appendOutput(html);

      // Focus the active field
      setTimeout(() => {
        const activeField = document.getElementById(`mail-${state.mailField}`);
        if (activeField) activeField.focus();

        // Add event listeners
        document.getElementById('mail-to').addEventListener('input', e => state.mailData.to = e.target.value);
        document.getElementById('mail-subject').addEventListener('input', e => state.mailData.subject = e.target.value);
        document.getElementById('mail-body').addEventListener('input', e => state.mailData.body = e.target.value);
        document.getElementById('mailSend').addEventListener('click', sendMail);
      }, 0);
    }

    function sendMail() {
      const { to, subject, body } = state.mailData;

      if (!to || !subject || !body) {
        appendError('All fields are required');
        playErrorSound();
        return;
      }

      // Simulate sending
      appendOutput(`<span class="accent">Sending mail to ${escapeHtml(to)}...</span>`);
      setTimeout(() => {
        appendOutput(`<span class="accent">✓ Mail sent successfully</span>`);
        appendMuted(`Subject: ${escapeHtml(subject)}`);
        state.isComposingMail = false;
        state.mailData = { to: '', subject: '', body: '' };
      }, 800);
    }

    function handleMailKeydown(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const fields = ['to', 'subject', 'body'];
        const idx = fields.indexOf(state.mailField);
        state.mailField = fields[(idx + 1) % fields.length];
        renderMailComposer();
      } else if (e.key === 'Escape') {
        state.isComposingMail = false;
        state.mailData = { to: '', subject: '', body: '' };
        appendMuted('Mail composition cancelled');
      } else if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        sendMail();
      }
    }

    // ============================================
    // COMMAND EXECUTION
    // ============================================
    function executeCommand(rawInput) {
      const input = rawInput.trim();
      if (!input) return;

      // Add to history
      state.commandHistory.push(input);
      state.historyIndex = state.commandHistory.length;

      // Echo command
      appendOutput(`<span class="command-echo">$ ${escapeHtml(input)}</span>`, 'command-echo');

      // Parse
      const parts = input.split(/\s+/);
      const cmdName = parts[0].toLowerCase();
      const args = parts.slice(1);

      const cmd = commands[cmdName];

      if (!cmd) {
        appendError(`Command not found: ${cmdName}`);
        appendMuted('Type "help" for available commands');
        playErrorSound();
        return;
      }

      try {
        cmd.execute(args);
        playEnterSound();
      } catch (e) {
        appendError(`Execution error: ${e.message}`);
        playErrorSound();
      }
    }

    // ============================================
    // EVENT HANDLERS
    // ============================================
    commandInput.addEventListener('input', () => {
      playKeypress();
      updateGhostText();
    });

    commandInput.addEventListener('keydown', (e) => {
      if (state.isComposingMail) {
        handleMailKeydown(e);
        return;
      }

      if (e.key === 'Enter') {
        const input = commandInput.value;
        commandInput.value = '';
        state.ghostText = '';
        commandInput.classList.remove('ghost-mode');
        const ghostEl = document.querySelector('.ghost-suggestion');
        if (ghostEl) ghostEl.remove();
        executeCommand(input);
      } else if (e.key === 'Tab') {
        e.preventDefault();
        applyCompletion();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (state.historyIndex > 0) {
          state.historyIndex--;
          commandInput.value = state.commandHistory[state.historyIndex];
          updateGhostText();
        }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (state.historyIndex < state.commandHistory.length - 1) {
          state.historyIndex++;
          commandInput.value = state.commandHistory[state.historyIndex];
        } else {
          state.historyIndex = state.commandHistory.length;
          commandInput.value = '';
        }
        updateGhostText();
      } else if (e.key === 'Escape') {
        commandInput.value = '';
        state.ghostText = '';
        commandInput.classList.remove('ghost-mode');
        const ghostEl = document.querySelector('.ghost-suggestion');
        if (ghostEl) ghostEl.remove();
      } else if (e.key === 'l' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        clearOutput();
      } else if (e.key === 'c' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        commandInput.value = '';
        state.ghostText = '';
        commandInput.classList.remove('ghost-mode');
        const ghostEl = document.querySelector('.ghost-suggestion');
        if (ghostEl) ghostEl.remove();
        appendOutput('<span class="command-echo">^C</span>', 'command-echo');
      }
    });

    // Global shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target === commandInput) return;

      if (e.key === 'F11') {
        e.preventDefault();
        toggleScanlines();
      } else if (e.key === 'F12') {
        e.preventDefault();
        toggleSound();
      }
    });

    // Focus input on click anywhere
    document.addEventListener('click', () => {
      commandInput.focus();
    });

    // Sound toggle
    soundToggle.addEventListener('click', toggleSound);

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      soundToggle.textContent = state.soundEnabled ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
      soundToggle.style.color = state.soundEnabled ? 'var(--fg)' : 'var(--fg-muted)';
      if (state.soundEnabled) initAudio();
    }

    function toggleScanlines() {
      state.scanlinesEnabled = !state.scanlinesEnabled;
      scanlines.classList.toggle('hidden', !state.scanlinesEnabled);
    }

    // ============================================
    // INITIALIZATION
    // ============================================
    function init() {
      initAudio();
      updatePrompt();
      updateTime();
      setInterval(updateTime, 1000);

      // Welcome message
      appendOutput(`
        <span class="accent">
    ╔═══════════════════════════════════════════════╗
    ║        TERMINAL BLOG v1.0.0                   ║
    ║        A CLI-style Developer Journal          ║
    ╚═══════════════════════════════════════════════╝
        </span>
      `);
      appendMuted('Type "help" for commands, "ls" to list posts');
      appendMuted('Press F11 to toggle CRT scanlines, F12 for sound');
      appendOutput('');

      // Focus input
      commandInput.focus();
    }

    // Start
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
