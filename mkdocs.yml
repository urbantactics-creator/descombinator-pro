site_name: Descombinator Pro
site_description: Desktop application for local audio source separation
site_author: Descombinator Team
repo_url: https://github.com/descombinator/descombinator
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Tutorials:
    - Installation: tutorials/installation.md
    - Quick Start: tutorials/quick-start.md
    - Feature Walkthrough: tutorials/feature-walkthrough.md
  - How-to:
    - Export Audio: how-to/export-audio.md
    - Play Mixed Tracks: how-to/play-mixed-tracks.md
    - Adjust Settings: how-to/adjust-settings.md
    - Troubleshooting: troubleshooting/troubleshooting.md
  - Explanations:
    - Architecture:
      - Overview: explanations/architecture/overview.md
      - Separation Engine: explanations/architecture/separation-engine.md
      - Performance Optimization: explanations/architecture/performance-optimization.md
    - Design Decisions:
      - Async-First ADR: explanations/design-decisions/async-first-adr.md
      - Modular Monolith ADR: explanations/design-decisions/modular-monolith-adr.md
    - Tech Stack: explanations/tech-stack.md
    - ADRs:
      - ADR-001 Modular Monolith: architecture/adr-001-modular-monolith.md
      - ADR-002 Async-First: architecture/adr-002-async-first.md
      - ADR-003 Pydantic State: architecture/adr-003-pydantic-state.md
      - ADR-004 Service Layer: architecture/adr-004-service-layer.md
      - ADR-005 Separation Backends: architecture/adr-005-separation-backends.md
      - ADR-006 Benchmark Regression Gate: architecture/adr-006-benchmark-regression-gate.md
      - Dependency Graph: architecture/dependency-graph.md
      - Module Contracts: architecture/module-contracts.md
  - API Reference:
    - Python API: api/python.md
    - Usage Guides: api/guides.md
  - Development:
    - Development Guide: development/development.md
    - Performance Tuning: development/performance.md
  - User Guide: guides/user-guide.md
  - FAQ: faq.md
  - License Compliance: license-compliance/license-compliance.md
  - Technical Debt: technical-debt/mypy-strict-coverage.md

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_signature: true
            show_source: true
            heading_level: 3
            members_order: alphabetical
            filters:
              exclude:
                - test_*
                - _*

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/descombinator/descombinator
