[project]
name = "descombinator"
version = "0.1.0"
description = "Audio source separation and processing engine"
requires-python = ">=3.10"
dependencies = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.11.0",
    "pydantic>=2.0.0",
]

[project.scripts]
descombinator = "main:main"

[tool.setuptools]
packages = ["app", "engine"]
