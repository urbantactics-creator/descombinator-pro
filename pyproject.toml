[project]
name = "descombinator"
version = "0.1.0"
description = "Audio source separation and processing engine"
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "soundfile>=0.11.0",
    "pydantic>=2.0.0",
]

[project.scripts]
descombinator = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".kilo", "docs", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "demucs.*",
    "PySide6.*",
    "librosa.*",
    "soundfile.*",
    "loguru.*",
    "pydantic.*",
    "numpy.*",
    "scipy.*",
    "pyqtgraph.*",
    "mutagen.*",
    "rich.*",
    "psutil.*",
    "tqdm.*",
    "resampy.*",
    "audioread.*",
    "openunmix.*",
    "onnxruntime.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Dev tooling (benchmarks and profiling scripts) — not type-strict by design.
module = ["benchmarks.*", "scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Pre-existing drift (Phase 6/7-era): Qt enum/attr typing gaps and untyped
# mutagen calls. Kept out of the Phase 8 scope; see PR #4 description.
module = [
    "app.ui.*",
    "app.widgets.*",
    "app.audio.mixer",
    "app.controllers.settings_controller",
    "app.controllers.main_controller",
    "app.services.playback_service",
    "engine.audio.metadata",
    "engine.audio.postprocessor",
    "engine.audio.resampler",
    "engine.export.metadata",
    "engine.export.writer",
    "engine.demucs.separator",
    "engine.inference.pipeline",
    "tests.ui.*",
    "tests.unit.app.widgets.*",
    "tests.unit.app.audio.*",
    "tests.unit.app.controllers.*",
    "tests.unit.app.services.*",
    "tests.unit.engine.export.*",
    "tests.unit.engine.inference.*",
    "tests.unit.engine.performance.*",
    "tests.integration.test_separator",
    "tests.integration.test_export_pipeline",
    "tests.integration.test_full_pipeline",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "bench_*.py"]
asyncio_mode = "auto"
qt_api = "pyside6"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "ui: UI tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app", "engine"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@\\w+.*\\s+\\.\\.\\.",
]

[tool.coverage.overrides]
# Per-module coverage thresholds
# engine: 85% minimum
# app: 70% minimum
# tests: 80% minimum (for test helper code)
engine_fail_under = 85
app_fail_under = 70
tests_fail_under = 80
