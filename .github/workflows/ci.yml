name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies (PySide6 OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libopengl0 libegl-mesa0 libglx-mesa0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict check
        run: mypy .

      - name: Pytest (unit + integration)
        run: pytest tests/unit/ tests/integration/ --cov=app --cov=engine --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Pytest (UI tests with xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1-mesa-glx libopengl0
          xvfb-run -a pytest tests/ui/ --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  benchmark:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1-mesa-glx libopengl0

      - name: Run benchmarks
        run: |
          xvfb-run -a pytest benchmarks/ -m "not slow" --benchmark-only \
            --benchmark-min-rounds=5 --benchmark-calibration-precision=3 \
            --benchmark-json=bench_results.json

      - name: Check regressions against baselines
        run: python scripts/bench/check_regressions.py --baseline benchmarks/baselines.json --result bench_results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench_results.json
          retention-days: 7
