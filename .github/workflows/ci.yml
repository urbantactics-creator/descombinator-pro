name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (PySide6 OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libpulse0 ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy strict check
        run: mypy .

      - name: Pytest (unit + integration)
        run: QT_QPA_PLATFORM=offscreen pytest tests/unit/ tests/integration/ --cov=app --cov=engine --cov-config=.coveragerc-unit --cov-report=xml --cov-report=term-missing --cov-fail-under=85

      - name: Pytest (UI tests with xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libopengl0
          xvfb-run -a pytest tests/ui/ --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run pip-audit
        run: pip-audit --descending --no-deps --fail-level high

  benchmark:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libopengl0 libpulse0 ffmpeg

      - name: Run benchmarks
        run: |
          xvfb-run -a pytest benchmarks/ -m "not slow" --benchmark-only \
            --benchmark-min-rounds=10 --benchmark-max-time=1.0 \
            --benchmark-warmup=on --benchmark-calibration-precision=3 \
            --benchmark-json=bench_results.json
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Check regressions against baselines
        run: |
          python -m scripts.bench.check_regressions \
            --baseline benchmarks/baselines.json \
            --result bench_results.json \
            --min-rounds 10 --max-time 1.0 --warmup on \
            --calibration-precision 3

      - name: Upload benchmark results
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: bench_results.json
          retention-days: 7
